<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PeopleOps · Search</title>
  <style>
    :root { --search-bg:#f5f7fb; --search-surface:#fff; --search-ink:#172238; --search-muted:#7a8799; --search-line:#e1e7ef; --search-primary:#4268ed; --search-soft:#edf2ff; --search-shadow:0 22px 60px rgba(25,42,75,.12); }
    body.dark { --search-bg:#0e1729; --search-surface:#17243b; --search-ink:#eef4ff; --search-muted:#9aa8bf; --search-line:#2b3b57; --search-primary:#7da3ff; --search-soft:#213861; --search-shadow:0 24px 64px rgba(0,0,0,.32); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--search-ink); background:var(--search-bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .search-page { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .search-stage { width:min(680px,100%); transform:translateY(-5vh); }
    .search-box { position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:64px; border:1px solid var(--search-line); border-radius:18px; padding:0 18px; color:var(--search-muted); background:var(--search-surface); box-shadow:var(--search-shadow); transition:border-color .18s ease,box-shadow .18s ease; }
    .search-box:focus-within { border-color:var(--search-primary); box-shadow:0 0 0 4px var(--search-soft),var(--search-shadow); }
    .search-icon { flex:0 0 auto; color:var(--search-primary); font-size:24px; line-height:1; }
    .search-box input { width:100%; border:0; outline:0; color:var(--search-ink); background:transparent; font:500 18px/1.3 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:-.01em; }
    .search-box input::placeholder { color:var(--search-muted); font-weight:400; }
    .clear-search { display:none; border:0; border-radius:7px; padding:6px 8px; color:var(--search-muted); background:var(--search-soft); font:500 11px/1 Inter,ui-sans-serif,system-ui; }
    .clear-search.show { display:block; }
    .search-results { display:none; overflow:hidden; margin-top:12px; border:1px solid var(--search-line); border-radius:16px; background:var(--search-surface); box-shadow:var(--search-shadow); }
    .search-results.show { display:block; }
    .result-group + .result-group { border-top:1px solid var(--search-line); }
    .result-heading { display:flex; justify-content:space-between; padding:12px 16px 8px; color:var(--search-muted); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .result-heading span:last-child { font-weight:500; letter-spacing:0; text-transform:none; }
    .result-item { display:flex; align-items:center; gap:11px; padding:11px 16px; color:var(--search-ink); text-decoration:none; transition:background .15s ease; }
    .result-item:hover,.result-item:focus { outline:0; background:var(--search-soft); }
    .result-avatar { width:36px; height:36px; display:grid; place-items:center; flex:0 0 auto; border-radius:11px; color:var(--search-primary); background:var(--search-soft); font-size:10px; font-weight:700; }
    .result-avatar.department { border-radius:9px; font-size:16px; }
    .result-text { min-width:0; flex:1; }
    .result-text b { display:block; overflow:hidden; font-size:13px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .result-text span { display:block; overflow:hidden; margin-top:3px; color:var(--search-muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .result-meta { color:var(--search-muted); font-size:10px; white-space:nowrap; }
    .result-arrow { color:var(--search-primary); font-size:14px; }
    .no-results { padding:25px 18px; color:var(--search-muted); text-align:center; font-size:12px; }
    @media(max-width:560px){.search-page{padding:15px}.search-stage{transform:translateY(-3vh)}.search-box{min-height:58px;border-radius:15px;padding:0 14px}.search-box input{font-size:16px}.result-item{padding:10px 13px}.result-meta{display:none}}
  </style>
</head>
<body>
  <main class="search-page">
    <section class="search-stage" aria-label="Employee database search">
      <label class="search-box" for="mainSearch"><span class="search-icon" aria-hidden="true">⌕</span><input id="mainSearch" type="search" autocomplete="off" autofocus placeholder="Search people or departments..." aria-controls="searchResults" aria-expanded="false" /><button class="clear-search" id="clearSearch" type="button">Clear</button></label>
      <div class="search-results" id="searchResults" aria-live="polite"></div>
    </section>
  </main>
  <script src="employee-db-search.js"></script>
</body>
</html>
